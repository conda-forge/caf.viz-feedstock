{% set version = "0.3.0" %}
{% set python_min = "3.11" %}

package:
  name: caf.viz
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/caf.viz/caf_viz-{{ version }}.tar.gz
  sha256: 05c7c26b28cbf53e2d1440c5be83df2dc9435a13cc262dba3d36abd7a91f5d94

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64.0.0
    - versioningit
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.19.0
    - pandas >=1.4.0
    - matplotlib-base >=3.8.2
    - scipy >=1.11.4
    - pydantic >=2.0.0
    - caf.toolkit >=0.14.0
    - folium >=0.20.0
    - geopandas >=1.1.3
    - tqdm >=4.67.3
    - branca >=0.8.2
    - shapely >=2.1.2
    - mapclassify >=2.10

test:
  imports:
    - caf.viz
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/transport-for-the-north/caf.viz
  summary: Visualisation functionality and tools for transport related data.
  doc_url: http://cafviz.readthedocs.io/
  dev_url: https://github.com/transport-for-the-north/caf.viz
  license: LicenseRef-TfN-License
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MattBuckley-TfN
    - BenTaylor-TfN
    - isaac-tfn
